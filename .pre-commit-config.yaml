# Pre-commit hook configuration for LeakGuard
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: leakguard
        name: LeakGuard Resource Leak Detector
        entry: python -m leakguard.cli scan
        language: system
        types: [python]
        pass_filenames: false
        args: ["."]
        additional_dependencies: []
        # Only run on Python files
        files: \.py$

# To install this hook, run:
#   pip install pre-commit
#   pre-commit install
#
# To run manually:
#   pre-commit run leakguard --all-files
#
# Configuration options:
# - The hook scans the entire repository (pass_filenames: false, args: ["."])
# - It will FAIL and BLOCK the commit if leaks are found at or above 'likely' confidence
# - The default threshold in cli.py is 'likely' - modify leakguard/cli.py to change
#
# Exit behavior:
# - Exit code 0 = no leaks found, commit proceeds
# - Exit code 1 = leaks found, commit is BLOCKED
