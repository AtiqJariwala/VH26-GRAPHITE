# Pre-commit hook configuration for LeakGuard
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: leakguard
        name: LeakGuard Resource Leak Detector
        entry: python -m leakguard.cli scan
        language: system
        types: [python]
        pass_filenames: false
        args: [".", "--fail-on=likely"]
        exclude: ^(tests/fixtures/leaky/|tests/|build/|\.egg-info/)
        # Only run on Python files
        files: \.py$

# To install this hook, run:
#   pip install pre-commit
#   pre-commit install
#
# To run manually:
#   pre-commit run leakguard --all-files
#
# Configuration:
# - Scans entire repo but excludes test fixtures with known leaks
# - Will BLOCK the commit if leaks are found at or above 'likely' confidence
# - Exit code 1 = commit blocked
#
# Exit behavior:
# - Exit code 0 = no leaks found, commit proceeds
# - Exit code 1 = leaks found, commit is BLOCKED
