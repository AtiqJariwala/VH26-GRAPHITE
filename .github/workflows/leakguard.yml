name: LeakGuard Resource Leak Detection

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  leakguard:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install LeakGuard
      run: |
        pip install -e .
    
    - name: Run LeakGuard scan
      run: |
        echo "🔍 Running LeakGuard resource leak detection..."
        # Exclude test fixtures with intentional leaks
        python -m leakguard.cli scan . --fail-on=likely 2>&1 | grep -v "tests/fixtures/leaky" || true
        
        # Scan only source code (exclude test fixtures)
        python -m leakguard.cli scan leakguard/ dashboard/ --fail-on=likely
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "❌ LeakGuard detected resource leaks!"
          echo "Review the output above for details."
          exit 1
        fi
        echo "✅ No resource leaks detected"
        exit 0

# Configuration notes:
# - This workflow will FAIL and ABORT the build if resource leaks are found
# - Adjust --fail-on level (definitely/likely/possible) based on your team's needs
# - Default is 'likely' which balances false positives and real issues
# - For new projects or strict enforcement, use --fail-on=possible
# - For legacy codebases, start with --fail-on=definitely
#
# Exit behavior:
# - Exit code 0 = no leaks found, build continues
# - Exit code 1 = leaks found, build FAILS and blocks merge (with branch protection)
#
# To enable strict merge blocking:
# 1. Go to repository Settings > Branches
# 2. Add branch protection rule for main/master
# 3. Enable "Require status checks to pass before merging"
# 4. Select "leakguard" as required check
